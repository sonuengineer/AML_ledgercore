server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression. The JS bundle measured 389 kB raw / 123 kB gzipped in Phase 8
  # -- a 3x reduction on the single largest thing this server sends.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Security headers. The API sets its own via helmet (Phase 3); a static
  # server has to set its own too, because nothing else is in the path.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Hashed assets are immutable BY CONSTRUCTION: Vite puts a content hash in
  # every filename, so index-DROv45W7.js can never change meaning. A one-year
  # immutable cache is therefore safe and means a returning user downloads
  # nothing but the HTML.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html is the OPPOSITE: it is the only unhashed file, and it is what
  # points at the current asset hashes. Caching it means a deploy does not
  # reach users until their cache expires -- the classic "I deployed but
  # everyone still sees the old app" bug.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA fallback. React Router owns the URL space, so a deep link like
  # /branches/abc must return index.html rather than 404 -- the router then
  # resolves it client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
