;; pgBouncer -- connection pooling in front of Postgres.
;;
;; THE PROBLEM IT SOLVES
;;
;; Postgres forks a BACKEND PROCESS per connection. Each one costs memory and
;; a slot in a hard `max_connections` limit (100 by default, and RDS sets it
;; from instance memory). Connections are therefore a scarce, expensive
;; resource -- unlike in MySQL, where they are threads.
;;
;; Phase 8 made that a live problem: three API nodes at connection_limit=10,
;; plus three workers at 10, is 60 connections for a workload whose steady
;; state was ONE active backend. Add autoscaling and the API exhausts the
;; database before it exhausts itself -- and the failure mode is brutal,
;; because a connection refusal takes down every node at once rather than
;; degrading one.
;;
;; pgBouncer multiplexes: the app opens many cheap connections to pgBouncer,
;; pgBouncer keeps a few expensive ones to Postgres.

[databases]
;; No password here -- credentials come from userlist.txt / auth_query.
ledgercore = host=postgres port=5432 dbname=ledgercore

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
;; plain auth is LOCAL ONLY. In AWS the app authenticates to RDS with an IAM
;; token and pgBouncer runs as a sidecar inside the task, so no password file
;; exists at all.

;; TRANSACTION pooling, not SESSION pooling.
;;
;;   session      one server connection per client connection for its whole
;;                life. Safe, and pools nothing useful -- 60 clients still
;;                means 60 backends.
;;   transaction  a server connection is assigned for the duration of one
;;                TRANSACTION and returned. This is where the multiplexing
;;                comes from: 60 idle clients share a handful of backends.
;;   statement    per statement. Breaks multi-statement transactions outright,
;;                which rules it out for a ledger.
;;
;; The cost of transaction pooling is real and specific: anything that relies
;; on SESSION state stops working, because the next statement may land on a
;; different backend. That means no session-level SET, no LISTEN/NOTIFY, no
;; session advisory locks, and no server-side prepared statements.
;;
;; Every one of those is accounted for in this codebase:
;;   * statement_timeout / lock_timeout are set through the connection string
;;     `options` parameter (Phase 10), which pgBouncer forwards on connect --
;;     NOT via a session SET, which would have been lost here.
;;   * the day-end lock uses pg_advisory_XACT_lock, which is transaction-scoped
;;     and therefore safe. A session-scoped advisory lock would leak.
;;   * Prisma must be told: `?pgbouncer=true` disables prepared statements.
;;     Without it you get "prepared statement s0 already exists" under load --
;;     intermittently, because it only happens when two clients land on the
;;     same backend.
pool_mode = transaction

;; Backends per database. Deliberately small -- that is the entire point.
default_pool_size = 20
;; Headroom for a burst without opening more backends.
reserve_pool_size = 10
reserve_pool_timeout = 3

;; Ceiling on client-side connections. Far larger than the server pool.
max_client_conn = 500

;; Kill a server connection that has been idle this long, so a traffic trough
;; releases database memory.
server_idle_timeout = 60

;; A client waiting this long for a pooled connection gets an error rather
;; than hanging. Same reasoning as every other timeout in Phase 10: an
;; unbounded wait turns a slow dependency into a total outage.
query_wait_timeout = 10

;; Terminate a query that has held a server connection this long. A backstop
;; underneath Postgres's own statement_timeout=10s.
query_timeout = 15

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
stats_period = 60

;; Lets us query SHOW POOLS / SHOW STATS to prove the multiplexing.
admin_users = ledgercore
stats_users = ledgercore
