worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # ---------------------------------------------------------------------------
  # Logging
  #
  # The two fields that matter for a load-balanced deployment are $upstream_addr
  # (which node answered) and $upstream_status (what IT said, which can differ
  # from what the client saw when nginx retried). Without them, "the API is
  # slow" is unanswerable.
  # ---------------------------------------------------------------------------
  log_format lb '$remote_addr $request '
                'status=$status upstream=$upstream_addr upstream_status=$upstream_status '
                'rt=$request_time urt=$upstream_response_time '
                'req_id=$http_x_request_id';

  access_log /dev/stdout lb;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # ---------------------------------------------------------------------------
  # Upstream
  #
  # ROUND ROBIN, the default, and deliberately not `ip_hash`.
  #
  # `ip_hash` is session affinity -- sticky sessions -- and it is exactly what
  # this architecture exists to avoid. The legacy system NEEDED it: a voucher
  # lived in `Context.Items`, in one process's memory, keyed by a SignalR
  # socket, so a request routed elsewhere would not find its own half-built
  # voucher. That forced sticky sessions, which in turn meant:
  #
  #   - a dead node lost every in-flight voucher it was holding;
  #   - a deploy lost them too;
  #   - load distributed by client IP, not by capacity, so one busy branch
  #     behind one NAT address hammered one node while the others idled.
  #
  # LedgerCore holds nothing in process memory, so plain round robin is
  # correct. Proving that is the whole point of Phase 8.
  # ---------------------------------------------------------------------------
  upstream ledgercore_api {
    server api-1:4000 max_fails=2 fail_timeout=10s;
    server api-2:4000 max_fails=2 fail_timeout=10s;
    server api-3:4000 max_fails=2 fail_timeout=10s;

    # Reuse upstream connections. Without this nginx opens a new TCP connection
    # per request, and at any real rate the nodes run out of ephemeral ports
    # long before they run out of CPU.
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    # A slow client must not be able to hold a worker connection forever.
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    # Required for upstream keepalive: the default "Connection: close" would
    # tear down the pooled connection after every request.
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Express has `trust proxy` set, so req.ip reads this. Without it every
    # request would appear to come from the load balancer -- and the Phase 6
    # per-IP login rate limit would throttle nginx instead of the attacker.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generate a request id when the client did not send one, so a trace exists
    # from the very edge. requestContext.ts honours an inbound id.
    proxy_set_header X-Request-Id      $http_x_request_id;

    proxy_connect_timeout 2s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # -------------------------------------------------------------------------
    # Retry policy
    #
    # `error` and `timeout` only -- and explicitly NOT `non_idempotent`.
    #
    # nginx will not retry a POST by default, and that default is correct here.
    # A POST /vouchers that timed out may well have COMMITTED; retrying it at
    # the load balancer would be a second posting attempt the client never
    # asked for. Retries on the money path belong to the client, which holds
    # the Idempotency-Key that makes them safe.
    #
    # `proxy_next_upstream error timeout` still covers the case that matters:
    # a node that is down or refusing connections, where nothing was executed.
    # -------------------------------------------------------------------------
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # -------------------------------------------------------------------------
    # Health check
    #
    # nginx OSS has no active health checking (that is nginx Plus), so this is
    # PASSIVE: `max_fails` / `fail_timeout` on the upstream take a node out
    # after two failures and retry it after ten seconds.
    #
    # The consequence is honest and worth stating: a node whose /readiness has
    # gone 503 keeps receiving traffic until two real requests fail. In AWS the
    # ALB does active checks against /readiness and this gap disappears --
    # which is one concrete reason Phase 11 uses an ALB rather than running
    # nginx as the balancer.
    #
    # This endpoint exists so an operator can see the balancer itself is alive,
    # independently of any upstream.
    # -------------------------------------------------------------------------
    location = /lb-health {
      access_log off;
      return 200 "nginx ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://ledgercore_api;
    }
  }
}
